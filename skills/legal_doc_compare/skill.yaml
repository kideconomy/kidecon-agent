name: legal-doc-compare
version: 0.1.0
category: documentation
description: >-
  Compares an outside legal document (pasted text or inbox file) against the
  local mirror of the legal protocol docs corpus, with Lexor providing
  candidate matching and guidance. Produces a gap-analysis report with corpus
  citations. Staff-only; read-only; never modifies the corpus.
entrypoint: handler.py
permissions:
  tools:
    - file_read
    - file_append_markdown
  network: true
config:
  docs:
    default:
      enabled: true
      repo_url: https://github.com/kideconomy/kideconomy-protocol-docs.git
      branch: main
      subfolder: legal-docs
      min_hub_tier: 3
    description: >-
      Read-only local mirror settings, delivered with this skill. The mirror
      provisions when enabled is true and a `github-docs` keyring PAT is
      present; min_hub_tier is clamped to >= 3 (staff-only). Local overrides
      under skills.legal_doc_compare.config.docs (or the legacy top-level
      `docs` block) win over these defaults.
